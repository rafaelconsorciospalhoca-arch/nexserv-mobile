ext {
    // Sem isso, o plugin @capacitor-firebase/authentication compila as
    // dependências do Google Sign-In como "compileOnly" (não entram de
    // verdade no APK) — o seletor de conta do Android ainda abre (é UI do
    // sistema), mas o SDK trava depois de escolher a conta porque as
    // classes de credencial não existem em tempo de execução.
    rgcfaIncludeGoogle = true
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}