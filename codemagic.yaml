workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      node: 20
      java: 21
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Sincronizar Capacitor
        script: npx cap sync android
      - name: Build APK de teste (debug, não assinado)
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: nexserv_appstore
    environment:
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.digitiva.nexserv
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Sincronizar Capacitor
        script: npx cap sync ios
      - name: Adicionar GoogleService-Info.plist ao projeto Xcode (push notifications)
        script: |
          gem install xcodeproj --no-document
          ruby scripts/add_firebase_plist.rb
      - name: Configurar assinatura de código no projeto Xcode
        script: xcode-project use-profiles
      - name: Numerar o build (obrigatório ser maior que o anterior na Apple)
        script: |
          cd ios/App
          agvtool new-version -all $(date +%s)
      - name: Build do .ipa
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - rafaelconsorciospalhoca@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: false
