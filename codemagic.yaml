workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      node: 20
      java: 21
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Sincronizar Capacitor
        script: npx cap sync android
      - name: Build APK de teste (debug, não assinado)
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: nexserv_appstore
    environment:
      node: 20
      vars:
        BUNDLE_ID: "br.com.digitiva.nexserv"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.digitiva.nexserv
    scripts:
      - name: Preparar keychain
        script: keychain initialize
      - name: Buscar (ou criar) certificado e perfil de assinatura na Apple
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Adicionar certificado ao keychain
        script: keychain add-certificates
      - name: Instalar dependências
        script: npm ci
      - name: Sincronizar Capacitor
        script: npx cap sync ios
      - name: Instalar CocoaPods
        script: |
          cd ios/App && pod install
      - name: Configurar assinatura de código no projeto Xcode
        script: xcode-project use-profiles
      - name: Build do .ipa
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - rafaelconsorciospalhoca@gmail.com
